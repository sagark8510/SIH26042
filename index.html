<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BhashaSetu | Universal Vernacular AI</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0d9488;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 30px;
    }

    .navbar {
      background: var(--primary);
      color: #ffffff;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .lang-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;
    }

    .container {
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: opacity 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-secondary { background: var(--secondary); color: #ffffff; }
    .btn-outline { 
      background: transparent; 
      border: 1.5px solid var(--primary); 
      color: var(--primary); 
    }
    .btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <nav class="navbar">
    <span class="brand">🌐 BhashaSetu</span>
    <a href="language.html" id="currentLangDisplay" class="lang-badge">🌐 Santhali</a>
  </nav>

  <main class="container">
    <div class="card" style="text-align: center; margin-top: 10px;">
      <h2 style="color: var(--primary); margin-bottom: 6px;">BhashaSetu</h2>
      <p style="color: var(--muted); font-size: 0.9rem;">
        Universal Vernacular Pedagogy & Real-Time Mother Tongue Bridge
      </p>
    </div>

    <!-- Choose Role -->
    <div class="card">
      <h3 style="margin-bottom: 14px; font-size: 1.05rem;">Select Access Mode</h3>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn btn-primary" onclick="selectRole('student', 'student.html')">
          🎓 Student Mode
        </button>
        <button class="btn btn-secondary" onclick="selectRole('teacher', 'teacher.html')">
          👨‍🏫 Teacher Mode
        </button>
      </div>
    </div>

    <!-- Modules -->
    <div class="card">
      <h4 style="margin-bottom: 12px; font-size: 0.95rem; color: var(--muted);">Direct Modules</h4>
      <div class="grid-2">
        <a href="language.html" class="btn btn-outline">🌐 Language</a>
        <a href="translator.html" class="btn btn-outline">🔄 Translate</a>
        <a href="voice-learning.html" class="btn btn-outline">🎤 Voice AI</a>
        <a href="lessons.html" class="btn btn-outline">📚 Lessons</a>
      </div>
    </div>
  </main>

  <script>
    const App = {
      getLanguage: () => localStorage.getItem("bhasha_lang") || "Santhali",
      setLanguage: (lang) => localStorage.setItem("bhasha_lang", lang),
      getRole: () => localStorage.getItem("bhasha_role") || "student",
      setRole: (role) => localStorage.setItem("bhasha_role", role),
      initHeader: function() {
        const badge = document.getElementById("currentLangDisplay");
        if (badge) badge.textContent = "🌐 " + this.getLanguage();
      }
    };

    function selectRole(role, targetUrl) {
      App.setRole(role);
      window.location.href = targetUrl;
    }

    window.addEventListener("DOMContentLoaded", () => {
      App.initHeader();
    });
  </script>
</body>
</html>
