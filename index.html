<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BhashaSetu | Universal Vernacular AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <nav class="navbar">
    <span class="brand">🌐 BhashaSetu</span>
    <a href="language.html" id="currentLangDisplay" class="lang-badge">🌐 Santhali</a>
  </nav>

  <main class="container">
    <div class="card" style="text-align: center; margin-top: 10px;">
      <h2 style="color: var(--primary); margin-bottom: 6px;">BhashaSetu</h2>
      <p style="color: var(--muted); font-size: 0.9rem;">
        Universal Vernacular Pedagogy & Real-Time Mother Tongue Bridge
      </p>
    </div>

    <!-- Choose Role -->
    <div class="card">
      <h3 style="margin-bottom: 14px; font-size: 1.05rem;">Select Access Mode</h3>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn btn-primary" onclick="selectRoleAndRedirect('student', 'student.html')">
          🎓 Student Mode
        </button>
        <button class="btn btn-secondary" onclick="selectRoleAndRedirect('teacher', 'teacher.html')">
          👨‍🏫 Teacher Mode
        </button>
      </div>
    </div>

    <!-- Core Prototype Modules -->
    <div class="card">
      <h4 style="margin-bottom: 12px; font-size: 0.95rem; color: var(--muted);">Direct Modules</h4>
      <div class="grid-2">
        <a href="language.html" class="btn btn-outline">🌐 Language</a>
        <a href="translator.html" class="btn btn-outline">🔄 Translate</a>
        <a href="voice-learning.html" class="btn btn-outline">🎤 Voice AI</a>
        <a href="lessons.html" class="btn btn-outline">📚 Lessons</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    function selectRoleAndRedirect(role, targetPage) {
      if (window.App) {
        App.setRole(role);
        App.navigateTo(targetPage);
      } else {
        localStorage.setItem("bhasha_role", role);
        window.location.href = targetPage;
      }
    }
  </script>
</body>
</html>
